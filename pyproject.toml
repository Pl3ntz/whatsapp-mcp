[project]
name = "whatsapp-mcp-local"
version = "0.5.2"
description = "MCP server: visão e escrita no WhatsApp nativo do macOS (leitura via banco local read-only + escrita com gate de confirmação)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=2.0.0,<3",
    "playwright>=1.62,<2",
    "pydantic>=2.7,<3",
]
keywords = ["mcp", "whatsapp", "macos", "agent", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Communications :: Chat",
]

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.server:main"
whatsapp-mcp-local = "whatsapp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Pl3ntz/whatsapp-mcp"
Repository = "https://github.com/Pl3ntz/whatsapp-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
